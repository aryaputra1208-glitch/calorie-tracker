<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calorie Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calories">
<meta name="theme-color" content="#fde3ea">
<meta name="color-scheme" content="light">
<style>
/* VOICE: calm, personal, Apple-like — one soft pink world
   IDEA: an iOS app made of frosted glass floating over a pink haze
   PICTURE: today's calorie ring in a glass card, gradient rose stroke
   COLOUR and TYPE: soft pink haze, white glass, rose accent #ff4f86, plum ink; SF Pro (system)
   LAYOUT: large title, glass cards, floating glass tab bar with a sliding lens */
:root{
  --spring:linear(0, 0.018, 0.062, 0.123, 0.192, 0.266, 0.339, 0.41, 0.477, 0.539, 0.596, 0.647, 0.693, 0.734, 0.771, 0.802, 0.83, 0.855, 0.876, 0.894, 0.909, 0.923, 0.935, 0.944, 0.953, 0.96, 0.966, 0.972, 0.976, 0.98, 0.983, 0.986, 0.988, 0.99, 0.991, 0.993, 1);--spring-d:.58s;
  --lens:linear(0, 0.018, 0.063, 0.126, 0.199, 0.276, 0.353, 0.429, 0.5, 0.566, 0.626, 0.681, 0.729, 0.771, 0.808, 0.84, 0.868, 0.891, 0.911, 0.928, 0.942, 0.953, 0.963, 0.971, 0.977, 0.982, 0.987, 0.99, 0.993, 0.995, 0.996, 0.998, 0.998, 0.999, 1);--lens-d:.48s;
  --ink:#2e1820;--tx2:#7d5d68;--tx3:#ad8d98;--rose:#ff4f86;--rose2:#ff8fb1;--blush:#ffd1de;
  --glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--edge:rgba(255,255,255,.85);
  --sh:0 1px 0 rgba(255,255,255,.9) inset,0 12px 32px -12px rgba(190,60,105,.28),0 2px 6px rgba(190,60,105,.06);
  --blur:blur(28px) saturate(180%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html{background:#fde3ea}
body{margin:0;color:var(--ink);font:16px/1.45 var(--font);letter-spacing:-.01em;min-height:100vh;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--font);letter-spacing:inherit}
.haze{position:fixed;inset:0;z-index:-1;background:radial-gradient(70vmax 70vmax at -10% -10%,#ffc2d4 0%,rgba(255,194,212,0) 60%),radial-gradient(60vmax 60vmax at 110% 45%,#ffe0c9 0%,rgba(255,224,201,0) 60%),radial-gradient(65vmax 65vmax at 40% 115%,#f7c6e6 0%,rgba(247,198,230,0) 60%),linear-gradient(160deg,#fff1f5 0%,#fde3ea 45%,#fbd6e2 100%)}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.52));border:.5px solid var(--edge);box-shadow:var(--sh);border-radius:26px}
/* header */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 4px 14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--tx2);margin:0 0 2px}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:0}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.pills{display:flex;gap:8px}
.pill{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;border:.5px solid var(--edge);background:var(--glass2);box-shadow:var(--sh);transition:transform .3s var(--spring),opacity .2s}
.pill:active{transform:scale(.9);transition-duration:.12s}.pill:disabled{opacity:.35}
.pill svg{width:18px;height:18px}
/* pages */
.page{display:none}.page.on{display:block}
.page.on>*{animation:pgin var(--spring-d) var(--spring) both}
.page.on>*:nth-child(2){animation-delay:.04s}.page.on>*:nth-child(3){animation-delay:.08s}.page.on>*:nth-child(4){animation-delay:.12s}.page.on>*:nth-child(5){animation-delay:.16s}
@keyframes pgin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card{padding:20px;margin-bottom:14px}
/* ring */
.ringwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:var(--tx2);font-weight:600}
.kv{display:grid;gap:10px}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--tx2)}
.kv b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,79,134,.12);color:#d02a63;white-space:nowrap}
.chip.over{background:#2e1820;color:#fff}
.chd{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 12px;font-size:15px;font-weight:600;color:var(--tx2)}
.btn.cam svg{width:28px;height:28px}
/* magnifying glass: card lifts + specular light follows pointer/finger */
.mg{position:relative;transition:transform var(--spring-d) var(--spring)}
.mg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s ease;
  background:radial-gradient(220px 160px at var(--mx,50%) var(--my,30%),rgba(255,255,255,.6),rgba(255,255,255,.12) 45%,transparent 70%)}
.mg.hot{transform:scale(1.025);box-shadow:0 1px 0 #fff inset,0 22px 44px -16px rgba(190,60,105,.4),0 2px 8px rgba(190,60,105,.08);z-index:2}
.mg.hot::after{opacity:1}
/* row lens inside meal groups */
.grp{position:relative;isolation:isolate}
.grp .lens{border-radius:16px;z-index:0}
.meal{position:relative;z-index:1}
.meal>*{transition:transform var(--spring-d) var(--spring)}
.meal>.th{transform-origin:center}.meal>div:nth-child(2){transform-origin:left center}.meal>.kc{transform-origin:right center}
.meal.mag>.th{transform:scale(1.1)}.meal.mag>div:nth-child(2),.meal.mag>.kc{transform:scale(1.04)}
/* macros */
.macs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mac{padding:14px 14px 12px;border-radius:22px}
.mac .n{font-size:12px;font-weight:600;color:var(--tx2)}
.mac .v{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.mac .v small{font-size:12px;color:var(--tx3);font-weight:500}
.track{height:6px;border-radius:3px;background:rgba(46,24,32,.07);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;transition:width .9s var(--spring)}
/* actions */
.acts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;margin-bottom:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:18px;border:0;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;padding:0 16px;transition:transform .35s var(--spring),box-shadow .3s}
.btn:active{transform:scale(.96);transition-duration:.12s}
.btn svg{width:21px;height:21px;flex:none}
.btn.pri{color:#fff;background:linear-gradient(180deg,#ff6b9a,#ff3d78);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 10px 24px -8px rgba(255,61,120,.6)}
.btn.gl{background:var(--glass2);border:.5px solid var(--edge);box-shadow:var(--sh)}
.btn:focus-visible,.pill:focus-visible,.tb button:focus-visible,.seg button:focus-visible{outline:3px solid rgba(255,79,134,.45);outline-offset:2px}
/* log */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.sec span{font-size:14px;color:var(--tx2);font-variant-numeric:tabular-nums}
.grp{padding:6px 16px;margin-bottom:12px}
.gh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--tx2);padding:10px 0 4px;text-transform:none}
.meal{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:.5px solid rgba(46,24,32,.08);cursor:pointer}
.gh+.meal{border-top:0}
.th{width:52px;height:52px;border-radius:14px;object-fit:cover;display:grid;place-items:center;font-weight:700;color:#d02a63;background:linear-gradient(145deg,#ffe3ec,#ffc6d8)}
.meal b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal small{display:block;font-size:13px;color:var(--tx2)}
.kc{text-align:right;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kc small{display:block;font-size:11px;color:var(--tx3);font-weight:500}
.empty{padding:34px 20px;text-align:center;color:var(--tx2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* segmented + lens */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:14px;background:rgba(46,24,32,.06);margin-bottom:14px;isolation:isolate}
.seg button{position:relative;z-index:1;border:0;background:none;min-height:36px;border-radius:11px;font-size:14px;font-weight:600;color:var(--tx2);cursor:pointer;transition:color .25s}
.seg button.on{color:var(--ink)}
.lens{position:absolute;left:0;top:0;width:0;height:0;border-radius:11px;pointer-events:none;z-index:0;opacity:0;
  background:radial-gradient(90px 40px at var(--mx,50%) var(--my,0%),rgba(255,255,255,.95),rgba(255,255,255,.75) 70%);
  box-shadow:0 1px 0 #fff inset,0 3px 10px rgba(190,60,105,.16),0 0 0 .5px rgba(255,255,255,.9);
  transition:transform var(--lens-d) var(--lens),width var(--lens-d) var(--lens),height var(--lens-d) var(--lens),opacity .22s ease;will-change:transform,width}
.lens.on{opacity:1}
/* chart */
.fig{position:relative;height:220px}.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig rect.b{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--spring) both}
@keyframes grow{from{transform:scaleY(0)}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{padding:16px;border-radius:22px}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:13px;color:var(--tx2)}
/* forms */
.list{padding:2px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-top:.5px solid rgba(46,24,32,.08)}
.row:first-child{border-top:0}
.row label{font-size:16px}
.row input{width:120px;text-align:right;border:0;background:none;font-size:16px;color:var(--tx2);padding:10px 0;min-height:44px}
.row input:focus{outline:none;color:var(--ink)}
.cap{font-size:13px;color:var(--tx2);margin:-6px 6px 18px}
.lbl{font-size:13px;font-weight:600;color:var(--tx2);margin:0 6px 8px;text-transform:none}
/* tab bar */
.tb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(360px,calc(100vw - 32px));padding:5px;border-radius:30px;z-index:5;isolation:isolate;
  background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:.5px solid var(--edge);box-shadow:0 1px 0 #fff inset,0 18px 40px -14px rgba(190,60,105,.4)}
.tb button{position:relative;z-index:1;display:grid;justify-items:center;gap:1px;border:0;background:none;padding:7px 4px 6px;border-radius:24px;font-size:11px;font-weight:600;color:var(--tx2);cursor:pointer;transition:color .25s,transform .3s var(--spring)}
.tb button:active{transform:scale(.92);transition-duration:.12s}
.tb button.on{color:var(--rose)}
.tb svg{width:24px;height:24px}
.tb .lens{border-radius:24px;background:radial-gradient(120px 50px at var(--mx,50%) var(--my,0%),rgba(255,255,255,.95),rgba(255,228,236,.8) 75%)}
/* sheet */
.ov{position:fixed;inset:0;z-index:9;background:rgba(80,20,40,.28);opacity:0;pointer-events:none;transition:opacity .35s ease}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:10;width:min(560px,100vw);max-height:92vh;overflow:auto;transform:translate(-50%,105%);
  border-radius:30px 30px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);
  background:#fff5f8;border-top:.5px solid #fff;will-change:transform;contain:layout paint;box-shadow:0 -20px 50px -20px rgba(190,60,105,.35);
  visibility:hidden;transition:transform .62s var(--spring),visibility 0s .62s}
.sheet.noanim .it{animation:none}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .62s var(--spring),visibility 0s}
input[type=number]{-moz-appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(46,24,32,.18);margin:0 auto 12px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lk{border:0;background:none;color:var(--rose);font-size:16px;font-weight:600;cursor:pointer;padding:10px 4px;min-height:44px}
.lk.dim{color:var(--tx2);font-weight:500}
.photo{position:relative;border-radius:22px;overflow:hidden;margin-bottom:12px;aspect-ratio:4/3;background:linear-gradient(145deg,#ffe3ec,#ffc6d8)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,.55) 48%,transparent 52%);background-size:100% 220%;animation:scan 1.6s var(--spring) infinite;display:none}
.photo.busy .scan{display:block}
@keyframes scan{from{background-position:0 120%}to{background-position:0 -120%}}
.photo .tag{position:absolute;left:12px;bottom:12px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
textarea,select{width:100%;border:.5px solid var(--edge);background:rgba(255,255,255,.7);border-radius:16px;padding:12px 14px;font-size:16px;color:var(--ink);min-height:48px}
textarea{resize:none;min-height:52px}
textarea:focus,select:focus{outline:3px solid rgba(255,79,134,.3)}
.st{font-size:14px;color:var(--tx2);margin:10px 4px;min-height:20px}
.st.err{color:#d02a63}
.it{padding:12px 14px;margin-bottom:8px;border-radius:20px;animation:pgin var(--spring-d) var(--spring) both}
.it .top{display:flex;gap:8px;align-items:center}
.it .top input{flex:1;font-weight:600}
.it input{border:0;background:none;font-size:16px;color:var(--ink);padding:6px 0;min-height:36px;width:100%}
.it input:focus{outline:none;box-shadow:0 1.5px 0 var(--rose)}
.it .por{font-size:13px;color:var(--tx2);min-height:28px;padding:2px 0}
.it .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.it .nums label{font-size:11px;color:var(--tx3);font-weight:600;display:grid;background:rgba(255,255,255,.55);border-radius:12px;padding:6px 10px 2px}
.it .nums input{font-weight:600;font-variant-numeric:tabular-nums;min-height:30px;padding:2px 0}
.x{width:30px;height:30px;border-radius:50%;border:0;background:rgba(46,24,32,.07);color:var(--tx2);cursor:pointer;font-size:15px;flex:none}
.skel{height:92px;border-radius:20px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.85),rgba(255,255,255,.45));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px;font-size:17px;font-weight:600}
.tot b{font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.demo{font-size:12px;color:var(--tx3);text-align:center;margin:6px 0 0}
@media(max-width:380px){.ringwrap{grid-template-columns:1fr;justify-items:center}.ring{width:170px;height:170px}.kv{width:100%}}
@media(hover:none){.mg.hot{transform:scale(1.015)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="haze" aria-hidden="true"></div>
<main class="app">

<section class="page on" id="p-today">
  <header class="hd">
    <div><p class="eyebrow" id="dsub"></p><h1 id="dlabel">Today</h1></div>
    <div class="pills">
      <button class="pill" id="prev" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="pill" id="next" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </header>
  <div class="glass card mg">
    <div class="chd"><span>Calories</span><span class="chip" id="kchip">On track</span></div>
    <div class="ringwrap">
      <div class="ring">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa3c0"/><stop offset="1" stop-color="#ff3d78"/></linearGradient></defs>
          <circle cx="80" cy="80" r="66" fill="none" stroke="rgba(46,24,32,.07)" stroke-width="14"/>
          <circle id="arc" cx="80" cy="80" r="66" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="414.69" stroke-dashoffset="414.69" style="transition:stroke-dashoffset 1s var(--spring)"/>
        </svg>
        <div class="c"><div class="big" id="kcal">0</div><div class="unit">kcal</div></div>
      </div>
      <div class="kv">
        <div><span>Goal</span><b id="ktarget">2.000</b></div>
        <div><span>Eaten</span><b id="keaten">0</b></div>
        <div><span id="kleftl">Left</span><b id="kleft">2.000</b></div>
      </div>
    </div>
  </div>
  <div class="macs" id="macs"></div>
  <div class="acts">
    <label class="btn pri cam" for="cam" aria-label="Snap food" title="Snap food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3v10.5H4z"/><circle cx="12" cy="13.5" r="3.4"/></svg></label>
    <button class="btn gl" id="manual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Manual</button>
  </div>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <div class="sec"><h2>Food Log</h2><span id="lcount"></span></div>
  <div id="log"></div>
  <p class="demo" id="demonote" hidden>Mockup — sample data.</p>
</section>

<section class="page" id="p-dash">
  <header class="hd"><div><p class="eyebrow">Overview</p><h1>Dashboard</h1></div></header>
  <div class="seg" id="seg"><button class="on" data-r="7">7 Days</button><button data-r="30">30 Days</button></div>
  <div class="glass card mg"><div class="sec" style="margin:0 0 6px"><h2 id="ctitle">Daily Calories</h2><span id="crange"></span></div><div class="fig"><svg id="chart" role="img" aria-label="Daily calorie chart"></svg></div></div>
  <div class="stats" id="stats"></div>
  <div class="glass card mg"><h2 style="margin-bottom:12px">Average Macros</h2><div id="macavg"></div></div>
</section>

<section class="page" id="p-set">
  <header class="hd"><div><p class="eyebrow">Preferences</p><h1>Settings</h1></div></header>
  <p class="lbl">Daily Goals</p>
  <div class="glass list" style="margin-bottom:10px">
    <div class="row"><label for="sT">Calories</label><input type="number" inputmode="numeric" id="sT"></div>
    <div class="row"><label for="sP">Protein (g)</label><input type="number" inputmode="numeric" id="sP"></div>
    <div class="row"><label for="sC">Carbs (g)</label><input type="number" inputmode="numeric" id="sC"></div>
    <div class="row"><label for="sF">Fat (g)</label><input type="number" inputmode="numeric" id="sF"></div>
  </div>
  <p class="lbl">AI</p>
  <div class="glass list" style="margin-bottom:10px">
    <div class="row"><label for="sK">Access Code</label><input type="password" id="sK" autocomplete="off" placeholder="from admin"></div>
    <div class="row"><span>Usage</span><span id="usage" style="color:var(--tx2);font-size:14px;text-align:right"></span></div>
  </div>
  <p class="lbl">Data</p>
  <div class="acts" style="grid-template-columns:1fr 1fr">
    <button class="btn gl" id="exp">Back Up</button>
    <label class="btn gl" for="imp">Restore</label>
  </div>
  <input type="file" id="imp" accept="application/json,.json" hidden>
  <p class="cap" id="sync"></p>
</section>
</main>

<nav class="tb" id="tb" aria-label="Navigation">
  <button class="on" data-p="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5H12z" fill="currentColor" stroke="none"/></svg>Today</button>
  <button data-p="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Dashboard</button>
  <button data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Settings</button>
</nav>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="grab"></div>
  <div class="shd"><button class="lk dim" id="cancel">Cancel</button><h2 id="shT">Add Food</h2><button class="lk" id="save">Save</button></div>
  <div class="photo" id="photo" hidden><img id="pv" alt="Food photo"><div class="scan"></div><span class="tag" id="ptag">Analyzing…</span></div>
  <textarea id="hint" rows="1" placeholder="Notes (optional), e.g. nasi ½ porsi"></textarea>
  <div class="acts" style="margin:10px 0 0;grid-template-columns:1fr 1fr">
    <button class="btn pri" id="ana" style="min-height:46px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>Analyze</button>
    <label class="btn gl" for="cam2" style="min-height:46px">Retake Photo</label>
  </div>
  <input type="file" id="cam2" accept="image/*" capture="environment" hidden>
  <p class="st" id="st"></p>
  <div id="items"></div>
  <button class="btn gl" id="addIt" style="width:100%;min-height:46px">+ Add Item</button>
  <div class="tot"><span>Total</span><b id="dtot">0 kcal</b></div>
  <select id="mtype" aria-label="Meal"></select>
</div>

<script>
{
/* ===== KONFIGURASI ===== */
const WORKER_URL='https://calorie-tracker.arya-putra1208.workers.dev';
const DEMO=false; /* true = sample data & simulated AI (mockup) */
/* ======================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
const fmt=n=>Math.round(n||0).toLocaleString('en-US');
const TYPES=['Breakfast','Lunch','Snack','Dinner'];
const HARI=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}}};
const LK=DEMO?'kalori-demo-v3':'kalori-v1';
const RATE={in:0.10,out:0.50,idr:16500};
let meals=[],settings={target:1800,p:90,c:220,f:60},day=new Date(),range=7,store,draft=null,busy=null;
let usage=ls.get('kalori-usage',{n:0,inT:0,outT:0});
const sum=(list,k)=>list.reduce((a,m)=>a+(m.items||[]).reduce((b,i)=>b+num(i[k]),0),0);
const ofDay=d=>meals.filter(m=>m.date===d);
const autoType=()=>{const h=new Date().getHours();return h<10?'Breakfast':h<15?'Lunch':h<18?'Snack':'Dinner'};

/* ---------- lens (glass highlight yang meluncur, seperti JD Generator) ---------- */
function lens(box,sel){
  const L=document.createElement('div');L.className='lens';box.insertBefore(L,box.firstChild);
  const place=el=>{if(!el)return;const b=box.getBoundingClientRect(),r=el.getBoundingClientRect(),appear=!L.classList.contains('on');
    if(appear)L.style.transition='opacity .22s ease';
    L.style.width=r.width+'px';L.style.height=r.height+'px';L.style.transform=`translate(${r.left-b.left}px,${r.top-b.top}px)`;
    if(appear){void L.offsetWidth;L.style.transition=''}L.classList.add('on')};
  const rest=()=>place(box.querySelector(sel+'.on'));
  box.addEventListener('mousemove',e=>{const r=L.getBoundingClientRect();L.style.setProperty('--mx',(e.clientX-r.left)+'px');L.style.setProperty('--my',(e.clientY-r.top)+'px')});
  box.querySelectorAll(sel).forEach(b=>b.addEventListener('mouseenter',()=>place(b)));
  box.addEventListener('mouseleave',rest);
  new ResizeObserver(rest).observe(box);
  return rest;
}

/* ---------- render ---------- */
function renderTop(){
  const key=dk(day),today=dk(new Date()),list=ofDay(key),k=sum(list,'kcal'),t=settings.target||2000;
  const y=new Date();y.setDate(y.getDate()-1);
  $('#dlabel').textContent=key===today?'Today':key===dk(y)?'Yesterday':HARI[day.getDay()]+', '+day.getDate();
  $('#dsub').textContent=day.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  $('#next').disabled=key>=today;
  $('#kcal').textContent=fmt(k);$('#ktarget').textContent=fmt(t);$('#keaten').textContent=fmt(k);
  const r=t-k;$('#kleftl').textContent=r>=0?'Left':'Over';$('#kleft').textContent=fmt(Math.abs(r));
  const c=$('#kchip'),p=k/t;c.textContent=r<0?'Over goal':p>.85?'Almost there':k?'On track':'Nothing logged yet';c.classList.toggle('over',r<0);
  $('#arc').style.strokeDashoffset=414.69*(1-Math.min(1,p));
  const M=[['Protein','protein',settings.p,'#ff4f86'],['Carbs','carbs',settings.c,'#ff9a6b'],['Fat','fat',settings.f,'#c58bff']];
  $('#macs').innerHTML=M.map(([n,f,g,col])=>{const v=sum(list,f);return `<div class="glass mac mg"><div class="n">${n}</div><div class="v">${fmt(v)}<small> / ${fmt(g)}g</small></div><div class="track"><i style="width:${g?Math.min(100,v/g*100):0}%;background:${col}"></i></div></div>`}).join('');
}
function renderLog(){
  const list=ofDay(dk(day)).sort((a,b)=>a.ts-b.ts);
  $('#lcount').textContent=list.length?list.length+(list.length>1?' meals':' meal'):'';
  if(!list.length){$('#log').innerHTML='<div class="glass empty"><b>Nothing logged yet</b>Snap your food and let AI count the calories.</div>';return}
  $('#log').innerHTML=TYPES.map(t=>{const g=list.filter(m=>m.type===t);if(!g.length)return'';
    return `<div class="glass grp"><div class="gh"><span>${t}</span><span>${fmt(sum(g,'kcal'))} kcal</span></div>${g.map(m=>{
      const ok=typeof m.thumb==='string'&&/^data:image\/(jpeg|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(m.thumb);
      const names=(m.items||[]).map(i=>i.name).filter(Boolean);
      return `<div class="meal" data-e="${esc(m.id)}">${ok?`<img class="th" src="${esc(m.thumb)}" alt="">`:`<div class="th">${esc((names[0]||'?').slice(0,1).toUpperCase())}</div>`}
      <div><b>${esc(names.join(', ')||'Untitled')}</b><small>P ${fmt(sum([m],'protein'))}g · C ${fmt(sum([m],'carbs'))}g · F ${fmt(sum([m],'fat'))}g</small></div>
      <div class="kc">${fmt(sum([m],'kcal'))}<small>kcal</small></div></div>`}).join('')}</div>`}).join('');
  document.querySelectorAll('#log .grp').forEach(rowLens);
}
function drawChart(){
  const s=$('#chart'),W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const days=[];for(let i=range-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const vals=days.map(d=>sum(ofDay(dk(d)),'kcal')),t=settings.target||2000,mx=Math.max(t*1.25,...vals)||1;
  const pb=22,pt=18,cw=W/range,y=v=>pt+(H-pt-pb)*(1-v/mx),bw=Math.max(4,cw*(range===7?.5:.62));
  let o='<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b9a"/><stop offset="1" stop-color="#ffb3c9"/></linearGradient></defs>';
  days.forEach((d,i)=>{const v=vals[i],x=i*cw+(cw-bw)/2,top=y(v);
    o+=v?`<rect class="b" style="animation-delay:${i*(range===7?.04:.012)}s" x="${x}" y="${top}" width="${bw}" height="${H-pb-top}" rx="${Math.min(8,bw/2)}" fill="${v>t?'#2e1820':'url(#bg)'}"><title>${esc(d.getDate()+'/'+(d.getMonth()+1)+': '+fmt(v)+' kcal')}</title></rect>`
         :`<rect x="${x}" y="${H-pb-4}" width="${bw}" height="4" rx="2" fill="rgba(46,24,32,.1)"/>`;
    const lab=range===7?HARI[d.getDay()]:(i%6===0||i===range-1?d.getDate():'');
    if(lab!=='')o+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="11" font-weight="600" fill="#ad8d98">${lab}</text>`});
  o+=`<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#ff4f86" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/><text x="${W}" y="${y(t)-6}" text-anchor="end" font-size="11" font-weight="600" fill="#d02a63">Goal ${fmt(t)}</text>`;
  s.innerHTML=o;
  $('#crange').textContent='Last '+range+' days';
  const logged=vals.filter(v=>v>0),avg=logged.length?logged.reduce((a,b)=>a+b,0)/logged.length:0,inT=logged.filter(v=>v<=t).length;
  let streak=0;for(let i=vals.length-1;i>=0&&vals[i]>0;i--)streak++;
  $('#stats').innerHTML=[[fmt(avg),'avg kcal/day'],[logged.length+'/'+range,'days logged'],[inT,'days within goal'],[streak+(streak===1?' day':' days'),'logging streak']].map(([b,s])=>`<div class="glass stat mg"><b>${b}</b><span>${s}</span></div>`).join('');
  const dl=days.map(d=>ofDay(dk(d))).filter(l=>l.length),avgM=f=>dl.length?dl.reduce((a,l)=>a+sum(l,f),0)/dl.length:0;
  $('#macavg').innerHTML=[['Protein','protein',settings.p,'#ff4f86'],['Carbs','carbs',settings.c,'#ff9a6b'],['Fat','fat',settings.f,'#c58bff']].map(([n,f,g,col])=>{const v=avgM(f);
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:14px"><span style="font-weight:600">${n}</span><span style="color:var(--tx2);font-variant-numeric:tabular-nums">${fmt(v)} / ${fmt(g)} g</span></div><div class="track"><i style="width:${g?Math.min(100,v/g*100):0}%;background:${col}"></i></div></div>`}).join('');
}
function renderUsage(){const usd=(usage.inT*RATE.in+usage.outT*RATE.out)/1e6;$('#usage').textContent=usage.n?`${usage.n} scans · ≈ Rp${fmt(usd*RATE.idr)}`:'None yet'}
const render=()=>{renderTop();renderLog();drawChart();[['#sT','target'],['#sP','p'],['#sC','c'],['#sF','f']].forEach(([id,k])=>{if(document.activeElement!==$(id))$(id).value=settings[k]})};

/* ---------- magnifying glass (cards + meal rows) ---------- */
let xyRaf=0;const setXY=(el,e)=>{const x=e.clientX,y=e.clientY;if(xyRaf)return;xyRaf=requestAnimationFrame(()=>{xyRaf=0;const r=el.getBoundingClientRect();el.style.setProperty('--mx',(x-r.left)+'px');el.style.setProperty('--my',(y-r.top)+'px')})};
let hotEl=null;const cool=()=>{if(hotEl){hotEl.classList.remove('hot');hotEl=null}};
const heat=(c,e)=>{if(hotEl!==c){cool();hotEl=c;c.classList.add('hot')}setXY(c,e)};
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest('.mg');c?heat(c,e):cool()},{passive:true});
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.mg');if(c&&e.pointerType!=='mouse')heat(c,e)},{passive:true});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{if(e.pointerType!=='mouse')setTimeout(cool,t==='pointercancel'?0:180)},{passive:true}));
document.addEventListener('mouseleave',cool);
function rowLens(g){
  const L=document.createElement('div');L.className='lens';g.insertBefore(L,g.firstChild);let cur=null;
  const go=row=>{if(row===cur)return;if(cur)cur.classList.remove('mag');cur=row;
    if(!row){L.classList.remove('on');return}
    const b=g.getBoundingClientRect(),r=row.getBoundingClientRect(),appear=!L.classList.contains('on');
    if(appear)L.style.transition='opacity .22s ease';
    L.style.width=(r.width+16)+'px';L.style.height=r.height+'px';L.style.transform=`translate(${r.left-b.left-8}px,${r.top-b.top}px)`;
    if(appear){void L.offsetWidth;L.style.transition=''}L.classList.add('on');row.classList.add('mag')};
  g.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')go(e.target.closest('.meal'))},{passive:true});
  g.addEventListener('pointerdown',e=>go(e.target.closest('.meal')));
  g.addEventListener('pointerleave',()=>go(null));
  g.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')setTimeout(()=>go(null),220)});
}

/* ---------- navigation ---------- */
const tbRest=lens($('#tb'),'button'),segRest=lens($('#seg'),'button');
$('#tb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.classList.contains('on'))return;
  document.querySelectorAll('#tb button').forEach(x=>x.classList.toggle('on',x===b));tbRest();
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
  window.scrollTo({top:0});if(b.dataset.p==='dash')requestAnimationFrame(drawChart)});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;range=+b.dataset.r;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));segRest();drawChart()});

/* ---------- sheet ---------- */
const blank=()=>({name:'',portion:'',kcal:0,protein:0,carbs:0,fat:0});
function openSheet(m,init){
  draft=m?JSON.parse(JSON.stringify(m)):{date:dk(day),type:autoType(),items:init||[],thumb:null};draft.blob=null;
  $('#hint').value='';status('');$('#shT').textContent=m?'Edit Food':'Add Food';
  $('#mtype').innerHTML=TYPES.map(t=>`<option${t===draft.type?' selected':''}>${t}</option>`).join('');
  setPreview(draft.thumb);const sh=$('#sheet');sh.classList.add('noanim');renderItems();sh.scrollTop=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#ov').classList.add('on');sh.classList.add('on');setTimeout(()=>sh.classList.remove('noanim'),700)}));
}
function closeSheet(){if(busy)busy.abort();$('#ov').classList.remove('on');$('#sheet').classList.remove('on');draft=null}
function setPreview(src){$('#photo').hidden=!src;if(src)$('#pv').src=src;$('#photo').classList.remove('busy')}
function status(t,err){const e=$('#st');e.className='st'+(err?' err':'');e.textContent=t}
function renderItems(){
  $('#items').innerHTML=draft.items.map((it,i)=>`<div class="glass it"><div class="top"><input data-i="${i}" data-k="name" value="${esc(it.name)}" placeholder="Food name"><button class="x" data-x="${i}" aria-label="Remove item">✕</button></div>
    <input class="por" data-i="${i}" data-k="portion" value="${esc(it.portion)}" placeholder="Portion, e.g. 1 plate (150 g)">
    <div class="nums">${[['kcal','Kcal'],['protein','Protein'],['carbs','Carbs'],['fat','Fat']].map(([k,l])=>`<label>${l}<input type="number" inputmode="decimal" data-i="${i}" data-k="${k}" value="${esc(Math.round(num(it[k])))}"></label>`).join('')}</div></div>`).join('');
  updTot();
}
const updTot=()=>{$('#dtot').textContent=fmt(sum([draft],'kcal'))+' kcal'};

async function loadImg(file){const u=URL.createObjectURL(file);try{const im=new Image();im.src=u;await im.decode();return im}finally{setTimeout(()=>URL.revokeObjectURL(u),1000)}}
function scale(im,max){const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}
async function onPhoto(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;if(!draft)openSheet();
  try{const im=await loadImg(f);draft.thumb=scale(im,120).toDataURL('image/jpeg',.55);
    draft.blob=await new Promise(r=>scale(im,1024).toBlob(r,'image/jpeg',.82));
    setPreview(scale(im,800).toDataURL('image/jpeg',.8));analyze();
  }catch(err){status('Could not read the photo. Try again or pick a JPG/PNG.',1)}
}
function parse(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw 0;return JSON.parse(t.slice(a,b+1))}
const loading=on=>{$('#photo').classList.toggle('busy',on);$('#ptag').textContent=on?'Analyzing…':'Done';$('#ana').disabled=on;
  if(on)$('#items').innerHTML='<div class="skel"></div><div class="skel" style="opacity:.7"></div>'};
async function analyze(){
  const hint=$('#hint').value.trim(),code=ls.get('kalori-code','');
  if(!draft.blob&&!hint&&!draft.thumb){status('Add a photo or describe the food first.',1);return}
  if(!DEMO&&!code){status('Enter your Access Code in Settings first. You can still add items manually.',1);return}
  if(busy)busy.abort();busy=new AbortController();const sig=busy.signal;
  status('');loading(true);
  try{let j;
    if(DEMO){await new Promise(r=>setTimeout(r,1800));
      j={items:[{name:'Nasi putih',portion:'1 centong (150 g)',kcal:195,protein:4,carbs:43,fat:0},{name:'Ayam bakar paha',portion:'1 potong (100 g)',kcal:240,protein:24,carbs:6,fat:13},{name:'Tumis kangkung',portion:'½ mangkuk',kcal:70,protein:3,carbs:5,fat:5},{name:'Sambal terasi',portion:'1 sdm',kcal:25,protein:0,carbs:2,fat:2}],note:''}}
    else{const img=draft.blob?await new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(draft.blob)}):null;
      const prompt=`Kamu ahli gizi Indonesia. ${img?'Lihat foto makanan terlampir dan ':''}perkirakan kandungan gizi setiap item makanan/minuman.
Aturan: pisahkan per item; perkirakan porsi (gram/ukuran rumah tangga) dari ukuran piring/alat makan; acu Tabel Komposisi Pangan Indonesia, hitung minyak & santan; tulis name dan portion dalam Bahasa Indonesia; note dalam Bahasa Inggris.
${hint?'Keterangan pengguna (prioritaskan): '+hint+'\n':''}Balas HANYA JSON: {"items":[{"name":"","portion":"","kcal":0,"protein":0,"carbs":0,"fat":0}],"note":""} — kcal dalam kkal, makro dalam gram, angka bulat. Jika tidak ada makanan, items kosong dan jelaskan di note.`;
      const content=[];if(img)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}});content.push({type:'text',text:prompt});
      const res=await fetch(WORKER_URL,{method:'POST',signal:sig,headers:{'Content-Type':'application/json','X-Access-Code':code},body:JSON.stringify({messages:[{role:'user',content}]})});
      if(res.status===401)throw{code:'bad_code'};if(res.status===429)throw{code:'rate_limited'};
      const r=await res.json();if(!res.ok)throw{code:'api'};
      if(r.usage){usage={n:usage.n+1,inT:usage.inT+(r.usage.input_tokens||0),outT:usage.outT+(r.usage.output_tokens||0)};ls.set('kalori-usage',usage);renderUsage()}
      j=parse((r.content||[]).map(c=>c.text||'').join(''))}
    if(sig.aborted||!draft)return;
    const items=(Array.isArray(j.items)?j.items:[]).slice(0,20).map(i=>({name:String(i.name||'').slice(0,80),portion:String(i.portion||'').slice(0,60),kcal:num(i.kcal),protein:num(i.protein),carbs:num(i.carbs),fat:num(i.fat)}));
    loading(false);
    if(!items.length){renderItems();status(String(j.note||'No food detected.'),1);return}
    draft.items=items;renderItems();status('');
  }catch(e){if(sig.aborted)return;loading(false);renderItems();
    status(e&&e.code==='bad_code'?'Wrong Access Code. Check it in Settings.':e&&e.code==='rate_limited'?'Too many requests. Please wait a moment.':'Could not read the AI result. Try again or fill in manually.',1)}
  finally{if(busy&&busy.signal===sig)busy=null}
}
async function saveDraft(){
  draft.items=draft.items.filter(i=>i.name.trim()||num(i.kcal));
  if(!draft.items.length){status('No items yet. Analyze a photo or add an item first.',1);return}
  const id=draft.id||('m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  await store.save(id,{kind:'meal',date:draft.date,type:$('#mtype').value,ts:draft.ts||Date.now(),items:draft.items,thumb:draft.thumb||null});closeSheet();
}

/* ---------- events ---------- */
$('#cam').addEventListener('change',onPhoto);$('#cam2').addEventListener('change',onPhoto);
$('#manual').addEventListener('click',()=>openSheet(null,[blank()]));
$('#ana').addEventListener('click',analyze);
$('#addIt').addEventListener('click',()=>{draft.items.push(blank());renderItems()});
$('#cancel').addEventListener('click',closeSheet);$('#ov').addEventListener('click',closeSheet);
$('#save').addEventListener('click',saveDraft);
$('#items').addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(i==null)return;draft.items[i][t.dataset.k]=t.type==='number'?num(t.value):t.value;updTot()});
$('#items').addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(x){draft.items.splice(+x.dataset.x,1);renderItems()}});
$('#log').addEventListener('click',e=>{const r=e.target.closest('[data-e]');if(r){const m=meals.find(m=>m.id===r.dataset.e);if(m)openSheet(m)}});
$('#prev').addEventListener('click',()=>{day.setDate(day.getDate()-1);render()});
$('#next').addEventListener('click',()=>{day.setDate(day.getDate()+1);render()});
[['#sT','target'],['#sP','p'],['#sC','c'],['#sF','f']].forEach(([id,k])=>$(id).addEventListener('change',e=>{const v=num(e.target.value);if(!v&&k==='target')return;settings={...settings,[k]:Math.round(v)};render();store.saveSettings(settings)}));

/* ---------- storage ---------- */
function localStore(){
  const d=ls.get(LK,{meals:{},settings:null});d.meals=d.meals||{};
  const cut=new Date();cut.setDate(cut.getDate()-45);const ck=dk(cut);Object.values(d.meals).forEach(m=>{if(m.date<ck)m.thumb=null});
  const flush=()=>{if(!ls.set(LK,d))$('#sync').textContent='Browser storage is full. Back up, then delete old entries.'};
  const pull=()=>{meals=Object.entries(d.meals).map(([id,m])=>({...m,id}));if(d.settings)settings={...settings,...d.settings};render()};
  pull();return{save:async(id,m)=>{d.meals[id]=m;flush();pull()},del:async id=>{delete d.meals[id];flush();pull()},saveSettings:async s=>{d.settings=s;flush()}};
}
function seedDemo(){
  const ic=(a,b)=>'data:image/svg+xml;base64,'+btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><rect width="52" height="52" fill="${a}"/><circle cx="26" cy="27" r="17" fill="#fff"/><circle cx="26" cy="27" r="11" fill="${b}"/></svg>`);
  const F={pagi:[[{name:'Bubur ayam',portion:'1 mangkuk',kcal:330,protein:14,carbs:48,fat:9}],[{name:'Roti gandum selai kacang',portion:'2 lembar',kcal:290,protein:11,carbs:32,fat:13},{name:'Kopi susu',portion:'1 gelas',kcal:110,protein:4,carbs:15,fat:4}]],
    siang:[[{name:'Nasi putih',portion:'150 g',kcal:195,protein:4,carbs:43,fat:0},{name:'Ayam bakar paha',portion:'100 g',kcal:240,protein:24,carbs:6,fat:13},{name:'Sayur asem',portion:'1 mangkuk',kcal:60,protein:2,carbs:10,fat:1}],[{name:'Gado-gado',portion:'1 piring',kcal:420,protein:16,carbs:38,fat:24}],[{name:'Nasi padang rendang',portion:'1 bungkus',kcal:690,protein:28,carbs:80,fat:28}]],
    cam:[[{name:'Pisang',portion:'1 buah',kcal:105,protein:1,carbs:27,fat:0}],[{name:'Es teh manis',portion:'1 gelas',kcal:120,protein:0,carbs:30,fat:0}]],
    malam:[[{name:'Nasi merah',portion:'120 g',kcal:150,protein:3,carbs:32,fat:1},{name:'Ikan kembung goreng',portion:'1 ekor',kcal:220,protein:21,carbs:2,fat:14},{name:'Tumis buncis',portion:'½ mangkuk',kcal:70,protein:2,carbs:7,fat:4}],[{name:'Mie ayam',portion:'1 mangkuk',kcal:520,protein:22,carbs:66,fat:18}]]};
  const T=[['Breakfast','pagi',8,ic('#ffe3c9','#ffb26b')],['Lunch','siang',12,ic('#ffd6e2','#ff7aa2')],['Snack','cam',16,ic('#fff2b8','#ffd23f')],['Dinner','malam',19,ic('#e9dcff','#b58cff')]];
  const d={meals:{},settings:null};let n=0;const now=new Date();
  for(let i=29;i>=0;i--){if(i>0&&i%9===4)continue;const dt=new Date();dt.setDate(now.getDate()-i);
    T.forEach(([type,k,h,th],j)=>{if(i===0&&h>now.getHours()&&j>1)return;if(k==='cam'&&(i%3===1))return;const opts=F[k],it=opts[(i+j)%opts.length];
      d.meals['d'+(n++)]={kind:'meal',date:dk(dt),type,ts:dt.setHours(h,0,0,0),items:it,thumb:th}})}
  ls.set(LK,d);
}
if(DEMO){$('#demonote').hidden=false;if(!ls.get(LK,null))seedDemo()}
store=localStore();renderUsage();
}
